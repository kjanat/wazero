[package]
name = "wazero-fuzz-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[[bin]]
doc = false
name = "memory_no_diff"
path = "fuzz_targets/memory_no_diff.rs"
test = false

[[bin]]
doc = false
name = "validation"
path = "fuzz_targets/validation.rs"
