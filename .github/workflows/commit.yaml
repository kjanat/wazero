name: Test
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths-ignore: # ignore docs as they are built with Netlify.
      - "**/*.md"
      - "site/**"
      - "netlify.toml"
  push:
    branches: [master]
    paths-ignore: # ignore docs as they are built with Netlify.
      - "**/*.md"
      - "site/**"
      - "netlify.toml"

env: # Update this prior to requiring a higher minor version in go.mod
  GO_VERSION: "1.27"

defaults:
  run: # use bash for all operating systems unless overridden
    shell: bash

permissions:
  contents: read

concurrency:
  # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-concurrency-to-cancel-any-in-progress-job-or-run
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  check:
    name: Pre-commit check
    runs-on: ubuntu-26.04
    steps:
      - name: Install latest wast2json and wasm-tools
        run: | # Needed for build.spectest. wabt includes wast2json; wasm-tools is used for exception-handling spectests.
          wabt_version=1.0.39
          wabt_url=https://github.com/WebAssembly/wabt/releases/download/${wabt_version}/wabt-${wabt_version}-linux-x64.tar.gz
          curl -sSL ${wabt_url} | tar --strip-components 2 -C /usr/local/bin -xzf - wabt-${wabt_version}/bin/wast2json
          wasm_tools_version=1.245.1
          wasm_tools_url=https://github.com/bytecodealliance/wasm-tools/releases/download/v${wasm_tools_version}/wasm-tools-${wasm_tools_version}-x86_64-linux.tar.gz
          curl -sSL ${wasm_tools_url} | tar --strip-components 1 -C /usr/local/bin -xzf - wasm-tools-${wasm_tools_version}-x86_64-linux/wasm-tools

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: # not cache: true as we also need to cache golint
          cache: false
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: check-${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'Makefile') }}

      - run: make build.spectest

      - run: make check

  test:
    name: ${{ matrix.platform.arch }}, ${{ matrix.platform.os }}, Go-${{ matrix.go-version }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false # don't fail fast as sometimes failures are arch/OS specific
      matrix: # Use versions consistent with wazero's Go support policy.
        platform:
          - os: ubuntu-26.04
            arch: amd64
          - os: windows-2025
            arch: amd64
          - os: macos-26
            arch: arm64
        go-version:
          - "1.27" # Floor Go version of wazero

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      # Ensure the pagefile is large enough to execute tests like TestStore_hammer_close on Windows.
      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.5
        if: runner.os == 'Windows'
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: "D:"

      # Run -race could be really slow without -short, so run them together on this workflow.
      # Since -short is not added in the scratch tests, all the tests are run in CI in practice.
      - run: make test go_test_options='-timeout 20m -race -short'

      - name: "Generate coverage report" # only once (not per OS)
        if: runner.os == 'Linux'
        run: make coverage

      - name: "Upload coverage report" # only on master push and only once (not per OS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && runner.os == 'Linux'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: bash <(curl -s https://codecov.io/bash)

  test_scratch:
    name: ${{ matrix.platform.arch }}, Linux (scratch), Go-${{ matrix.go-version }}${{ matrix.platform.no_prot_exec && ', no-prot-exec' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false # don't fail fast as sometimes failures are arch/OS specific
      matrix: # Use versions consistent with wazero's Go support policy.
        go-version:
          - "1.27" # Floor Go version of wazero
        platform:
          - os: ubuntu-26.04
            arch: amd64
          - os: ubuntu-26.04
            arch: amd64
            no_prot_exec: true
          - os: ubuntu-26.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build test binaries
        run: |
          parent="$(dirname "$PWD")/"
          go list -f '{{.Dir}}' ./... | grep -E -v 'spectest' | while IFS= read -r pkg; do
          basepath="${pkg#"${parent}"}"
          echo go test "${pkg}" -c -o "_tests/${basepath}.test"
          go test "${pkg}" -c -o "_tests/${basepath}.test"
          done
          go build -o wazerocli ./cmd/wazero
        env:
          GOARCH: ${{ matrix.platform.arch }}
          CGO_ENABLED: 0

      - name: Build scratch container
        run: |
          echo 'FROM scratch' >> Dockerfile
          echo 'CMD ["/test", "-test.v"]' >> Dockerfile
          docker buildx build -t wazero:test --platform linux/${{ matrix.platform.arch }} .

      - name: Write seccomp config
        if: ${{ matrix.platform.no_prot_exec }}
        run: |
          echo '{
            "defaultAction": "SCMP_ACT_ALLOW",
            "syscalls": [
              {
                "names": ["mprotect", "pkey_mprotect", "mmap", "mmap2"],
                "action": "SCMP_ACT_ERRNO",
                "errnoRet": 1,
                "args": [
                  { "index": 2, "value": 4, "valueTwo": 4, "op": "SCMP_CMP_MASKED_EQ" }
                ]
              }
            ]
          }' > no-prot-exec.json

      - name: Run built test binaries
        # This runs all tests compiled above in sequence. Note: This mounts /tmp to allow t.TempDir() in tests.
        env:
          NO_PROT_EXEC: ${{ matrix.platform.no_prot_exec }}
        run: |
          seccomp=()
          if [ "$NO_PROT_EXEC" = true ]; then
            seccomp=(--security-opt "seccomp=$PWD/no-prot-exec.json")
          fi
          find _tests -name "*.test" -print0 | xargs -0 -t -Itestbin docker run --platform linux/${{ matrix.platform.arch }} -v "$PWD/testbin:/test" -v "$PWD/wazerocli:/wazero" -e WAZEROCLI=/wazero --tmpfs /tmp "${seccomp[@]}" --rm -t wazero:test

  test_bsd:
    name: amd64, ${{ matrix.os.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false # don't fail fast as sometimes failures are OS specific
      matrix:
        os:
          - name: freebsd
            version: "14.3"
          - name: openbsd
            version: "7.8"
          - name: netbsd
            version: "10.1"

    steps:
      - uses: actions/checkout@v7

      - name: Build test binaries
        run: |
          parent="$(dirname "$PWD")/"
          go list -f '{{.Dir}}' ./... | grep -E -v 'imports|sysfs' | while IFS= read -r pkg; do
          basepath="${pkg#"${parent}"}"
          echo go test "${pkg}" -c -o "_tests/${basepath}.test"
          go test "${pkg}" -c -o "_tests/${basepath}.test"
          done
          go build -o wazerocli ./cmd/wazero
        env:
          GOOS: ${{ matrix.os.name }}

      - name: Start VM
        uses: cross-platform-actions/action@v1.7.0
        with:
          operating_system: ${{ matrix.os.name }}
          version: ${{ matrix.os.version }}
          shell: bash
          sync_files: runner-to-vm

      - name: Run built test binaries
        shell: cpa.sh {0} --sync-files runner-to-vm --environment-variables WAZEROCLI
        env:
          WAZEROCLI: ./wazerocli
        # This runs all tests compiled above in sequence.
        run: find _tests -name "*.test" | xargs -t -Itestbin nice testbin -test.short -test.v

  test_vm:
    name: amd64, ${{ matrix.os.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false # don't fail fast as sometimes failures are OS specific
      matrix:
        os:
          - name: dragonfly
            version: "6.4.2"
          - name: illumos
            version: "r151054"
          - name: solaris
            version: "11.4"

    steps:
      - uses: actions/checkout@v7

      - name: Build test binaries
        run: |
          parent="$(dirname "$PWD")/"
          go list -f '{{.Dir}}' ./... | grep -E -v 'imports|sysfs' | while IFS= read -r pkg; do
          basepath="${pkg#"${parent}"}"
          echo go test "${pkg}" -c -o "_tests/${basepath}.test"
          go test "${pkg}" -c -o "_tests/${basepath}.test"
          done
          go build -o wazerocli ./cmd/wazero
        env:
          GOOS: ${{ matrix.os.name }}

      - name: Run built test binaries (dragonfly)
        if: matrix.os.name == 'dragonfly'
        uses: vmactions/dragonflybsd-vm@v1
        env: &vm-env
          WAZEROCLI: ./wazerocli
        with: &vm-with
          usesh: true
          copyback: false
          envs: WAZEROCLI
          # This runs all tests compiled above in sequence.
          run: find _tests -name "*.test" | xargs -t -Itestbin nice testbin -test.short -test.v

      - name: Run built test binaries (illumos)
        if: matrix.os.name == 'illumos'
        uses: vmactions/omnios-vm@v1
        env: *vm-env
        with: *vm-with

      - name: Run built test binaries (solaris)
        if: matrix.os.name == 'solaris'
        uses: vmactions/solaris-vm@v1
        env: *vm-env
        with: *vm-with

  # This ensures that internal/integration_test/fuzz is runnable, and is not intended to
  # run full-length fuzzing while trying to find low-hanging frontend bugs.
  fuzz:
    name: Minimal Fuzzing (${{ matrix.platform.os }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false # don't fail fast as sometimes failures are arch/OS specific
      matrix: # Use versions consistent with wazero's Go support policy.
        platform:
          - os: ubuntu-26.04
            arch: amd64
          - os: macos-26
            arch: arm64

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/cache@v6
        id: cache
        with:
          # Cache corpus and artifacts so that we don't start from scratch but rather with a meaningful corpus
          # in the subsequent CI jobs.
          path: |
            ~/.cargo
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.rustup/toolchains/
            internal/integration_test/fuzz/target
            internal/integration_test/fuzz/fuzz/artifacts
            internal/integration_test/fuzz/fuzz/corpus
          key: build-fuzz-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'Makefile', '**/Cargo.lock', '**/Cargo.toml', '**/*.rs') }}

      - run: cargo install cargo-fuzz
        if: steps.cache.outputs.cache-hit != 'true'
      # Run fuzzing only for a minute, not a full-length intensive one, but 60 seconds seems enough to find minor "front-end"
      # bugs which might exist in binary parser, validation, or instantiation phase while not pressuring CI jobs.
      - run: make fuzz fuzz_timeout_seconds=60
        if: ${{ github.event_name  == 'pull_request' }}
      # Run a bit longer on master branch push!
      - run: make fuzz fuzz_timeout_seconds=180
        if: ${{ github.event_name  == 'push' }}
